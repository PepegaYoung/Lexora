name: Windows tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Restore bundled dictionaries
        run: python scripts/prepare_data.py
      - name: Check publication files
        run: python scripts/check_publication.py
      - name: Fast offline regression tests
        run: >-
          python -m unittest tests.test_core tests.test_escape tests.test_oauth
          tests.test_screen tests.test_web_translation tests.test_upgrade
          tests.test_hotkey_variants.NativeVariantsTests
          tests.test_catalog_input_card.CatalogInputTests
          tests.test_game_safety.SafetyPolicyTests
          tests.test_gamepad.GamepadLogicTests
          tests.test_i18n.LanguageSettingsTests
          tests.test_preview_cleanup.PreviewImageTests
